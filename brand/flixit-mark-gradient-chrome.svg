<!--
  FLIXIT — primary mark, gradient ("Chrome")

  A metallic ramp: alternating light and shadow stops with a cool blue cast,
  the way real chrome picks up sky and ground. Reads as streetwear/Y2K.

  Designed for DARK grounds — the light stops disappear on cream. Use the
  flat mark on light backgrounds if you take this direction.

  GRADIENT: 5 stops, vertical, so the "horizon" line sits across the middle
  of the mark. Keep the hard-ish transition at 0.5 — a smooth blend loses
  the metal and just looks grey.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <defs>
    <linearGradient id="flixit-chrome" gradientUnits="userSpaceOnUse" x1="60" y1="20" x2="60" y2="104">
      <stop offset="0" stop-color="#f4f7fd" />
      <stop offset="0.32" stop-color="#93a3c4" />
      <stop offset="0.5" stop-color="#dfe7f5" />
      <stop offset="0.52" stop-color="#6d7da3" />
      <stop offset="0.78" stop-color="#c8d3e8" />
      <stop offset="1" stop-color="#5a6b8f" />
    </linearGradient>
  </defs>
  <g id="flixit-mark" fill="none" stroke="url(#flixit-chrome)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round">
    <path id="hook" d="M58 44 V34 A10 10 0 1 0 38 34" />
    <path id="stem" d="M58 44 C56 62 50 80 46 96" />
    <path id="arm-upper" d="M58 44 C70 42 84 40 96 36" />
    <path id="arm-lower" d="M52 70 C61 69 71 67 80 64" />
  </g>
</svg>
