<!--
  FLIXIT — primary mark, gradient ("Electric")

  Same geometry as flixit-mark.svg; only the paint changes. A tight
  indigo luminance ramp — one hue, light to dark — so it reads as
  lighting on a solid object rather than as a rainbow.

  GRADIENT: #6675ff -> #2618a0, diagonal across the mark's optical bbox
  (26,20) to (96,104). gradientUnits is userSpaceOnUse, so the ramp stays
  locked to the artwork no matter how you scale it.

  Keep flixit-mark.svg (flat) for: sizes under 24px, embroidery, single-
  colour print, and anywhere the background is already busy.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <defs>
    <linearGradient id="flixit-electric" gradientUnits="userSpaceOnUse" x1="36" y1="20" x2="64" y2="100">
      <stop offset="0" stop-color="#6675ff" />
      <stop offset="1" stop-color="#2618a0" />
    </linearGradient>
  </defs>
  <g id="flixit-mark" fill="none" stroke="url(#flixit-electric)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path id="hook" d="M58 44 V34 A10 10 0 1 0 38 34" />
    <path id="stem" d="M58 44 C56 62 50 80 46 96" />
    <path id="arm-upper" d="M58 44 C70 42 84 40 96 36" />
    <path id="arm-lower" d="M52 70 C61 69 71 67 80 64" />
  </g>
</svg>
