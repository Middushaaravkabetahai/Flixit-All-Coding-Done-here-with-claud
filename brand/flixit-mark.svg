<!--
  FLIXIT — primary mark ("Hook F")

  An F with a garment-hanger hook curling off its top-left corner. Reads as a
  monogram first and a hanger second, which is the right order: the hanger is
  the wink, not the whole joke.

  CONSTRUCTION (120 x 120 grid, whole numbers only):
    stroke weight    12
    stem             x = 52, from y = 42 to y = 98
    upper arm        y = 42, runs x 52 -> 90   (38 long, flush with stem top)
    lower arm        y = 70, runs x 52 -> 78   (26 long — ~two-thirds of upper)
    hook             semicircle, centre (42, 32), radius 10, opening down-left
    optical bbox     x 26-96, y 20-104

  Two relationships hold this together — keep them if you redraw it:
    1. the hook curls AWAY from the arms (left), so nothing collides and the
       counters stay open at small sizes
    2. hook radius (10) is slightly less than the stroke weight (12), so the
       curl reads as a hook and not as a loop

  Edit in Figma / Illustrator / Inkscape. Outline the strokes before you scale
  if your tool doesn't scale stroke weight proportionally.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <g id="flixit-mark"
     fill="none"
     stroke="#18181b"
     stroke-width="12"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path id="hook" d="M52 42 V32 A10 10 0 1 0 32 32" />
    <path id="stem" d="M52 42 V98" />
    <path id="arm-upper" d="M52 42 H90" />
    <path id="arm-lower" d="M52 70 H78" />
  </g>
</svg>
