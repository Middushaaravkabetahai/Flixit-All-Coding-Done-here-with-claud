<!--
  FLIXIT — primary mark, gradient ("Sunset")

  Indigo through magenta into amber. The amber end is pulled toward the
  brand's brass (#b8863b) so the gradient lands inside the existing palette
  instead of importing a fourth colour from nowhere.

  Bolder than Electric and more obviously "fashion". Costs a little
  legibility at small sizes, where the amber end goes pale on cream.

  GRADIENT: #2d3bd6 -> #c2379b -> #eda13f, diagonal across (26,20)-(96,104).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <defs>
    <linearGradient id="flixit-sunset" gradientUnits="userSpaceOnUse" x1="26" y1="20" x2="96" y2="104">
      <stop offset="0" stop-color="#2d3bd6" />
      <stop offset="0.55" stop-color="#c2379b" />
      <stop offset="1" stop-color="#eda13f" />
    </linearGradient>
  </defs>
  <g id="flixit-mark" fill="none" stroke="url(#flixit-sunset)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path id="hook" d="M52 42 V32 A10 10 0 1 0 32 32" />
    <path id="stem" d="M52 42 V98" />
    <path id="arm-upper" d="M52 42 H90" />
    <path id="arm-lower" d="M52 70 H78" />
  </g>
</svg>
