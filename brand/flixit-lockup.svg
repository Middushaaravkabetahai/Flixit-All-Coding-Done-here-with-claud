<!--
  FLIXIT — horizontal lockup (mark + wordmark)

  PROPORTIONS (locked — don't re-space by eye):
    mark              120 x 120
    gap               30  (= 25% of the mark's width)
    wordmark cap height 62 (= ~52% of the mark height)
    wordmark baseline optically centred against the mark

  CLEAR SPACE: keep at least 30 units (one gap-width) clear on every side.
  MINIMUM SIZE: 24px tall for the mark alone; 110px wide for this lockup —
  below that the wordmark's counters close up. Use the mark on its own instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 458.4 120" width="458" height="120" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <g id="mark" fill="none" stroke="#18181b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path id="hook" d="M52 42 V32 A10 10 0 1 0 32 32" />
    <path id="stem" d="M52 42 V98" />
    <path id="arm-upper" d="M52 42 H90" />
    <path id="arm-lower" d="M52 70 H78" />
  </g>
  <g id="wordmark" fill="#18181b" transform="translate(150 29.0) scale(0.09012) translate(0 688.0) scale(1 -1)">
<path id="letter-f-0" transform="translate(0.0 0)" d="M74 0V688H630V523H295V405H583V247H295V0Z" />
    <path id="letter-l-1" transform="translate(637.0 0)" d="M74 0V688H295V176H648V0Z" />
    <path id="letter-i-2" transform="translate(1274.0 0)" d="M74 0V688H295V0Z" />
    <path id="letter-x-3" transform="translate(1613.0 0)" d="M4 0 250 364 28 688H295L399 512H403L508 688H755L532 363L778 0H510L383 214H379L252 0Z" />
    <path id="letter-i-4" transform="translate(2361.0 0)" d="M74 0V688H295V0Z" />
    <path id="letter-t-5" transform="translate(2700.0 0)" d="M249 0V512H23V688H695V512H470V0Z" />
  </g>
</svg>
