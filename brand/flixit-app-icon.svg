<!--
  FLIXIT — app icon, 1024 x 1024

  Full bleed, square, no rounded corners and no transparency baked in: iOS and
  Android apply their own mask, and a pre-rounded icon gets double-rounded.

  The mark is scaled 6x and centred on its OPTICAL bbox (60.5, 62) — not on
  the 120-grid centre, which would sit it a unit left and read off-balance.
  At 6x it fills ~49% of the canvas height, which is where a glyph needs to
  be to hold its own on a home screen.

  Export at: 1024 (App Store), 512 (Play Store), 180/120 (iOS), 192/512 (Android).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Flixit">
  <title>Flixit</title>
  <rect id="ground" width="1024" height="1024" fill="#18181b" />
  <g id="mark"
     transform="translate(512 512) scale(7.2) translate(-67 -60)"
     fill="none"
     stroke="#f3ede3"
     stroke-width="11"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path id="hook" d="M58 44 V34 A10 10 0 1 0 38 34" />
    <path id="stem" d="M58 44 C56 62 50 80 46 96" />
    <path id="arm-upper" d="M58 44 C70 42 84 40 96 36" />
    <path id="arm-lower" d="M52 70 C61 69 71 67 80 64" />
  </g>
</svg>
