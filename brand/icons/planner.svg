<!-- Flixit / Outfit Planner — a day marked on a calendar grid, with the
     hanger hook as the binding ring. One outfit, one day. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Outfit Planner">
  <title>Outfit Planner</title>
  <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect id="sheet" x="6.5" y="11" width="35" height="32" rx="6" />
    <path id="rail" d="M6.5 21.5c12 .8 23 .6 35-.6" />
    <path id="ring-left" d="M15 14V8.5a2.5 2.5 0 0 1 5 0" />
    <path id="ring-right" d="M28 14V8.5a2.5 2.5 0 0 1 5 0" />
    <path id="marked-day" d="M17.5 31.5c1.9 1.3 3.5 2.9 4.8 4.7 2.2-3.3 5-6.1 8.2-8.4" />
  </g>
</svg>
