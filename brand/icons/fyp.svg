<!-- Flixit / Style FYP — a masonry feed. Unequal heights are the point:
     an even 2x2 grid reads as "apps", not "feed". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Style FYP">
  <title>Style FYP</title>
  <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" transform="skewX(-6) translate(2.6 0)">
    <rect id="tile-tl" x="7" y="7" width="14" height="19" rx="4" />
    <rect id="tile-tr" x="27" y="7" width="14" height="11" rx="4" />
    <rect id="tile-bl" x="7" y="32" width="14" height="9" rx="4" />
    <rect id="tile-br" x="27" y="24" width="14" height="17" rx="4" />
  </g>
</svg>
